# Temporary: tests and builds the restore candidate for isolated staging.
# Not a release workflow; drop this commit before any merge.
name: Candidate Linux build

on:
  push:
    branches: ["import-registry-init-20260924"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_TOOLCHAIN: 1.96.0

jobs:
  build:
    name: Test and build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install toolchain and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Library tests
        run: |
          cargo test --locked -p utils --lib
          cargo test --locked -p store --lib
          cargo test --locked -p common --lib
          rm -rf target/debug

      - name: Build stalwart (release profile without LTO)
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --locked --release -p stalwart

      - name: Package
        run: |
          mkdir dist
          cp target/release/stalwart dist/stalwart
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "profile=release lto=false codegen-units=16 features=default"
            rustc -Vv
            cargo -V
          } > dist/BUILD-INFO.txt
          cd dist && sha256sum stalwart BUILD-INFO.txt > SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stalwart-candidate-x86_64-linux-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 14
